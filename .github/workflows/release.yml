# Builds signed-ready bundles when a version tag is pushed (or by hand):
#   macOS: Vinter.app + .dmg (Apple Silicon)   Linux: .AppImage + .deb (x86_64)
# Each bundle includes the `vinter` command (CLI and MCP server) as a sidecar.
# Produces a draft GitHub release with the bundles and the updater files.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (updater signing; required)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                         (macOS signing + notarization; optional,
#                                                                   also uncomment them in the build step)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The app bundles `vinter` (bundle.externalBin in tauri.conf.json), which
      # Tauri expects at app/src-tauri/binaries/vinter-cli-<target triple>.
      # Without it, build.rs puts a stand-in there that only prints a message.
      - name: Build the vinter command
        shell: bash
        run: |
          cargo build --release --locked -p vinter-cli --target ${{ matrix.target }}
          mkdir -p app/src-tauri/binaries
          cp target/${{ matrix.target }}/release/vinter app/src-tauri/binaries/vinter-cli-${{ matrix.target }}
          app/src-tauri/binaries/vinter-cli-${{ matrix.target }} --version

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization: add these once you have a Developer ID
          # certificate. Leave them out until then: empty values make the
          # bundler try (and fail) to import a certificate. Without them the
          # app is ad-hoc signed (bundle.macOS.signingIdentity = "-").
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Vinter v__VERSION__
          releaseDraft: true
          uploadUpdaterJson: true
          # No version in file names, so github.com/.../releases/latest/download/<name>
          # always serves the newest build (the website's download links rely on it).
          releaseAssetNamePattern: "[name]_[arch][ext]"
          args: ${{ matrix.args }}
