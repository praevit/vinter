[workspace]
resolver = "3"
members = ["crates/vinter-core", "crates/vinter-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Vinter <hello@getvinter.app>"]
homepage = "https://getvinter.app"
repository = "https://github.com/praevit/vinter"
rust-version = "1.85"

[workspace.dependencies]
vinter-core = { path = "crates/vinter-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
libc = "0.2"
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
# Maintained fork of xz2. `static` so release builds never link Homebrew's liblzma.
liblzma = { version = "0.4", features = ["static"] }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
percent-encoding = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
humantime = "2"
trash = "5"
lnk = "0.6"
pelite = { version = "0.10", default-features = false, features = ["std", "mmap"] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
base64 = "0.23"
tauri-plugin-dialog = "2.8"
tauri-plugin-deep-link = "2.6"
tauri-plugin-updater = "2.14"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tauri = "2.12"
tauri-build = "2.7"
# tauri-specta has no stable v2 release yet; these RCs must move together.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
