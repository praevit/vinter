[package]
name = "vinter-core"
description = "Core library for Vinter: Wine runtimes, bottles, recipes and launchers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Derives `specta::Type` on public types so the Tauri app can generate TS bindings.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
directories.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
liblzma.workspace = true
flate2.workspace = true
walkdir.workspace = true
uuid.workspace = true
humantime.workspace = true
trash.workspace = true
specta = { workspace = true, features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
