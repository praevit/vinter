[package]
name = "vinter-app"
description = "Vinter desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vinter-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
vinter-core = { workspace = true, features = ["specta"] }
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
humantime.workspace = true
tokio.workspace = true
uuid.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-notification.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via Tauri; used to bring Wine windows to the front.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }

[target.'cfg(target_os = "linux")'.dependencies]
# tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption` with a struct literal;
# rust-ini 0.21.3 added fields to it, which breaks the Linux build. Unpin once
# the plugin is updated.
rust-ini = "=0.21.1"
