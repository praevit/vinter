# Vinter website: getvinter.app
#
# Included inside the `http` block of the stock nginx.conf (as
# /etc/nginx/conf.d/default.conf). Traefik (Dokploy) terminates TLS and
# forwards the original Host header, so nginx only speaks plain HTTP on :80
# and decides redirects by host.

server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/css text/plain text/xml application/xml application/json image/svg+xml;

# Cache policy per path. Set through one variable rather than per-location
# `add_header`, because any `add_header` inside a location would silently drop
# the security headers defined on the server.
map $uri $vinter_cache_control {
    ~^/updates/                           "no-cache";
    ~*\.(?:css|svg|png|ico|webp|woff2)$   "public, max-age=31536000, immutable";
    default                               "no-cache";
}

# Short links. Matched case-insensitively against the raw request URI, with
# or without a trailing slash; sub-paths pass through where they mean
# something (e.g. /github/issues/12, /changelog/tag/v1.0) and the query string
# is kept (added in the server block). Built from $request_uri, which stays
# percent-encoded, so nothing decoded (like %0d%0a) can reach the Location
# header. First matching line wins.
# Downloads use GitHub's releases/latest/download/<file>, which always serves
# the newest published release (asset names carry no version, see release.yml).
map $request_uri $vinter_short_link {
    default                                      "";
    "~*^/download/mac/?(?:\?|$)"                 "https://github.com/praevit/vinter/releases/latest/download/Vinter_aarch64.dmg";
    "~*^/download/linux/?(?:\?|$)"               "https://github.com/praevit/vinter/releases/latest/download/Vinter_amd64.AppImage";
    "~*^/download/deb/?(?:\?|$)"                 "https://github.com/praevit/vinter/releases/latest/download/Vinter_amd64.deb";
    # Vinter's updater checks getvinter.app/updates/latest.json.
    "~*^/updates/latest\.json(?:\?|$)"          "https://github.com/praevit/vinter/releases/latest/download/latest.json";
    "~*^/download(?:/[^?]*)?(?:\?|$)"            "https://github.com/praevit/vinter/releases/latest";
    "~*^/github(?<gh_rest>/[^?]*)?(?:\?|$)"      "https://github.com/praevit/vinter$gh_rest";
    "~*^/issues(?<issues_rest>/[^?]*)?(?:\?|$)"  "https://github.com/praevit/vinter/issues$issues_rest";
    "~*^/changelog(?<log_rest>/[^?]*)?(?:\?|$)"  "https://github.com/praevit/vinter/releases$log_rest";
    "~*^/contact(?:/[^?]*)?(?:\?|$)"             "mailto:hello@getvinter.app";
    "~*^/(?:support|sponsor|donate)/?(?:\?|$)"    "https://github.com/sponsors/praevit";
}

# Old and alternate domains: permanent redirect to the canonical site.
server {
    listen 80;
    server_name vinterapp.com www.vinterapp.com www.getvinter.app;
    return 301 https://getvinter.app$request_uri;
}

# getvinter.app, plus any other host (Dokploy preview domain, localhost).
server {
    listen 80 default_server;
    server_name getvinter.app _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $vinter_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    # No HSTS here: Traefik/Dokploy owns TLS and can add it.

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Short links (see the map above). 302 so they can change later.
    if ($vinter_short_link) {
        return 302 $vinter_short_link$is_args$args;
    }

    # Reserved for the Tauri updater manifest (M6). Never cached.
    location /updates/ {
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
