# Vinter website: getvinter.app
#
# Included inside the `http` block of the stock nginx.conf (as
# /etc/nginx/conf.d/default.conf). Traefik (Dokploy) terminates TLS and
# forwards the original Host header, so nginx only speaks plain HTTP on :80
# and decides redirects by host.

server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/css text/plain text/xml application/xml application/json image/svg+xml;

# Cache policy per path. Set through one variable rather than per-location
# `add_header`, because any `add_header` inside a location would silently drop
# the security headers defined on the server.
map $uri $vinter_cache_control {
    ~^/updates/                           "no-cache";
    ~*\.(?:css|svg|png|ico|webp|woff2)$   "public, max-age=31536000, immutable";
    default                               "no-cache";
}

# Old and alternate domains: permanent redirect to the canonical site.
server {
    listen 80;
    server_name vinterapp.com www.vinterapp.com www.getvinter.app;
    return 301 https://getvinter.app$request_uri;
}

# getvinter.app, plus any other host (Dokploy preview domain, localhost).
server {
    listen 80 default_server;
    server_name getvinter.app _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $vinter_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    # No HSTS here: Traefik/Dokploy owns TLS and can add it.

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Short links. 302 so they can change later.
    # TODO(M6): point /download/mac at the .dmg asset once releases exist.
    # TODO(M6): point /download/linux at the .AppImage asset once releases exist.
    location = /download        { return 302 https://github.com/praevit/vinter/releases/latest; }
    location = /download/mac    { return 302 https://github.com/praevit/vinter/releases/latest; }
    location = /download/linux  { return 302 https://github.com/praevit/vinter/releases/latest; }
    location = /github          { return 302 https://github.com/praevit/vinter; }
    location = /issues          { return 302 https://github.com/praevit/vinter/issues; }
    location = /changelog       { return 302 https://github.com/praevit/vinter/releases; }
    location = /contact         { return 302 mailto:hello@getvinter.app; }

    # Reserved for the Tauri updater manifest (M6). Never cached.
    location /updates/ {
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
